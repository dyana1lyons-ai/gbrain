name: B349 contributor regression proof
on:
  push:
    branches: ['codex/b349-proof']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: [{"name": "21-native-vision-and-nightly-quality-cli", "ref": "7cd00727bd06290c6c35ae9bcd94498fcdac8fc0", "tests": "test/b336-cli-protocols.test.ts test/b336-quality-repair-retry.test.ts test/claude-cli-images.test.ts test/eval-nightly-quality.test.ts", "revert": "scripts/generate-flag-registry.ts src/commands/autopilot-probes.ts src/commands/eval-nightly-quality.ts src/commands/eval.ts src/core/ai/providers/claude-cli-images.ts src/core/ai/providers/claude-cli-language-model.ts src/core/audit-quality-probe.ts src/core/cli-flag-registry.generated.ts src/core/cycle/nightly-probe-adapters.ts src/core/cycle/nightly-quality-probe.ts"}, {"name": "28-legacy-publisher-http-surface", "ref": "ded2685e02810676d25e539a7db2de10b295cdd7", "tests": "test/legacy-http-publisher-surface.test.ts", "revert": "src/commands/serve-http-mcp.ts"}, {"name": "30-nightly-fixture-reference-date", "ref": "43a2f410b92cb8fcf1ee6e0513756a9843ffe285", "tests": "test/nightly-fixture-reference-date.test.ts", "revert": "test/fixtures/longmemeval-nightly.jsonl"}, {"name": "33-grade-takes-operator-policy", "ref": "1bab22c3dbe4bae1372e7b994c63090c40c32c69", "tests": "test/grade-takes.test.ts", "revert": "src/core/config-runtime-keys.ts src/core/cycle.ts src/core/cycle/grade-takes-measured.ts src/core/cycle/grade-takes-policy.ts src/core/cycle/grade-takes.ts"}, {"name": "42-content-flag-history", "ref": "e017db582006f18cac3f9e7e70a9d4d22797a549", "tests": "test/import-content-flag-history.test.ts", "revert": "src/core/import-file.ts src/core/page-state/import-guard.ts"}, {"name": "26-atoms-batch-full-input", "ref": "aab448034a4cf7a2359ddc938c43c0bd046b3580", "tests": "test/b336-atoms-batch.test.ts test/b336-atoms-batch-fallback.test.ts", "revert": "src/core/cycle/extract-atoms-batch.ts src/core/cycle/extract-atoms.ts"}, {"name": "35-owner-quarantine", "ref": "eba527ef79f6483e445a41bc63243ae60f537d3c", "tests": "test/owner-quarantine.serial.test.ts", "revert": "src/cli/subcommands.ts src/commands/quarantine-hide.ts src/commands/quarantine.ts src/core/cli-flag-registry.generated.ts src/core/context/turn-context.ts src/core/cycle/extract-atoms.ts src/core/eligibility/activation.ts src/core/eligibility/sql.ts src/core/import-file.ts src/core/import-screen.ts src/core/persistence/page-mutations.ts src/core/persistence/page-prepare.ts src/core/quarantine.ts"}, {"name": "27-gmail-text-originals", "ref": "df4c3211fa436ae5c704138cf71fdfc71fda6929", "tests": "test/google-attachment-originals.test.ts test/google-attachment-sync.test.ts", "revert": "src/core/google/attachment-originals.ts src/core/google/attachment-receipts.ts src/core/google/google-clients.ts src/core/google/google-render.ts src/core/google/types.ts"}, {"name": "40-cached-concept-provenance", "ref": "27131cdb73443b773e84fa77fe32402d8d855f7f", "tests": "test/b336-concept-provenance-resume.test.ts", "revert": "src/core/cycle/synthesize-concepts.ts src/core/cycle/concept-publication.ts"}, {"name": "36-connector-prewrite-review", "ref": "ea3b14918277e0029954434a43d69a9a637acfbf", "tests": "test/b336-web-review.test.ts test/e2e/b336-web-review-pglite.test.ts", "revert": "src/commands/connectors/sync.ts src/core/cli-flag-registry.generated.ts src/core/config-runtime-keys.ts src/core/connectors/sync.ts"}]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Install public locked dependencies
        id: install
        run: bun install --frozen-lockfile --ignore-scripts > install.log 2>&1
      - name: Typecheck exact candidate
        id: types
        run: bun run typecheck > typecheck.log 2>&1
      - name: Run synthetic candidate tests
        id: tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        env:
          GBRAIN_HOME: ${{ runner.temp }}/candidate-brain
          GBRAIN_SELF_UPGRADE_MODE: 'off'
        run: env -u DATABASE_URL -u GBRAIN_DATABASE_URL bun test --max-concurrency=1 --timeout=120000 ${{ matrix.tests }} > tests.log 2>&1
      - name: Require an executed regression failure with baseline product code
        id: baseline
        if: ${{ always() && steps.tests.outcome == 'success' }}
        env:
          GBRAIN_HOME: ${{ runner.temp }}/baseline-brain
          GBRAIN_SELF_UPGRADE_MODE: 'off'
        run: |
          git fetch https://github.com/garrytan/gbrain.git 9689b047037df8fe1ad4f122b36f9ca0e50230c9 --depth=1
          git restore --source=9689b047037df8fe1ad4f122b36f9ca0e50230c9 -- ${{ matrix.revert }}
          set +e
          env -u DATABASE_URL -u GBRAIN_DATABASE_URL bun test --max-concurrency=1 --timeout=120000 ${{ matrix.tests }} > baseline.log 2>&1
          code=$?
          set -e
          echo "baseline_exit=$code" >> baseline.log
          python3 - <<'PY_CHECK'
          import pathlib,re
          text=pathlib.Path('baseline.log').read_text()
          failed=re.search(r'(^|\n)\s*[1-9][0-9]* fail',text)
          crashed=re.search(r'(^|\n)\s*[1-9][0-9]* error',text)
          assert failed and not crashed, 'Baseline discrimination NOT_PROVEN; missing imports and crashes do not count'
          PY_CHECK
      - name: Retain complete logs and exact revision
        if: ${{ always() }}
        run: |
          git rev-parse HEAD > exact-head.txt
          bun --version > bun-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: regression-${{ matrix.name }}
          path: |
            install.log
            typecheck.log
            tests.log
            baseline.log
            exact-head.txt
            bun-version.txt
