name: B349 contributor regression proof
on:
  push:
    branches: ['codex/b349-proof']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: [{"name": "19-engine-chat-readiness", "ref": "ad968792b8e189403cda9ee9a762c144e6b09dcd", "tests": "test/effective-readiness.test.ts", "revert": "src/core/harness/capabilities.ts src/core/ops/sources.ts src/core/readiness.ts"}, {"name": "20-compiled-supervisor-detach", "ref": "1a14c4134e50f5a31449ecccfb13b168db546206", "tests": "test/detached-supervisor-invocation.test.ts", "revert": "src/core/minions/detached-stderr.ts"}, {"name": "21-native-vision-and-nightly-quality-cli", "ref": "e32beb5f2daf539a6d744c5d13dada59a10e5cfa", "tests": "test/b336-cli-protocols.test.ts test/b336-quality-repair-retry.test.ts test/claude-cli-images.test.ts test/eval-nightly-quality.test.ts", "revert": "scripts/generate-flag-registry.ts src/commands/autopilot-probes.ts src/commands/eval.ts src/core/ai/providers/claude-cli-language-model.ts src/core/audit-quality-probe.ts src/core/cli-flag-registry.generated.ts src/core/cycle/nightly-probe-adapters.ts src/core/cycle/nightly-quality-probe.ts"}, {"name": "29-sweep-claims-preservation", "ref": "56de6d0a4943d8b705cabc583739f4bbadf68d22", "tests": "test/sweep-claims-preservation.test.ts", "revert": "src/core/sweep.ts"}, {"name": "33-grade-takes-operator-policy", "ref": "a31a339c845c485211eb0035aeeccbd492bebe3c", "tests": "test/grade-takes.test.ts", "revert": "src/core/config-runtime-keys.ts src/core/cycle.ts src/core/cycle/grade-takes-measured.ts src/core/cycle/grade-takes.ts"}]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Install public locked dependencies
        id: install
        run: bun install --frozen-lockfile --ignore-scripts > install.log 2>&1
      - name: Typecheck exact candidate
        id: types
        run: bun run typecheck > typecheck.log 2>&1
      - name: Run synthetic candidate tests
        id: tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        env:
          GBRAIN_HOME: ${{ runner.temp }}/candidate-brain
          GBRAIN_SELF_UPGRADE_MODE: 'off'
        run: env -u DATABASE_URL -u GBRAIN_DATABASE_URL bun test --max-concurrency=1 --timeout=120000 ${{ matrix.tests }} > tests.log 2>&1
      - name: Require an executed regression failure with baseline product code
        id: baseline
        if: ${{ always() && steps.tests.outcome == 'success' }}
        env:
          GBRAIN_HOME: ${{ runner.temp }}/baseline-brain
          GBRAIN_SELF_UPGRADE_MODE: 'off'
        run: |
          git fetch https://github.com/garrytan/gbrain.git 9689b047037df8fe1ad4f122b36f9ca0e50230c9 --depth=1
          git restore --source=9689b047037df8fe1ad4f122b36f9ca0e50230c9 -- ${{ matrix.revert }}
          set +e
          env -u DATABASE_URL -u GBRAIN_DATABASE_URL bun test --max-concurrency=1 --timeout=120000 ${{ matrix.tests }} > baseline.log 2>&1
          code=$?
          set -e
          echo "baseline_exit=$code" >> baseline.log
          python3 - <<'PY_CHECK'
          import pathlib,re
          text=pathlib.Path('baseline.log').read_text()
          failed=re.search(r'(^|\n)\s*[1-9][0-9]* fail',text)
          crashed=re.search(r'(^|\n)\s*[1-9][0-9]* error',text)
          assert failed and not crashed, 'Baseline discrimination NOT_PROVEN; missing imports and crashes do not count'
          PY_CHECK
      - name: Retain complete logs and exact revision
        if: ${{ always() }}
        run: |
          git rev-parse HEAD > exact-head.txt
          bun --version > bun-version.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: regression-${{ matrix.name }}
          path: |
            install.log
            typecheck.log
            tests.log
            baseline.log
            exact-head.txt
            bun-version.txt
